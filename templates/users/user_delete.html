{% extends "base.html" %}
{% block content %}
<h2>Eliminar usuario</h2>
<p>¿Estás seguro de eliminar a "{{ object.username }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Sí, eliminar</button>
    <a href="{% url 'users_list' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
