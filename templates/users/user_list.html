{% extends "base.html" %}
{% block content %}
<h2>Usuarios</h2>
<table class="table">
    <thead>
        <tr><th>ID</th><th>Usuario</th><th>Nombre</th><th>Acciones</th></tr>
    </thead>
    <tbody>
        {% for user in users %}
        <tr>
            <td>{{ user.id }}</td>
            <td>{{ user.username }}</td>
            <td>{{ user.get_full_name }}</td>
            <td>
                <a href="{% url 'user_update' user.pk %}" class="btn btn-sm btn-warning">Editar</a>
                <a href="{% url 'user_delete' user.pk %}" class="btn btn-sm btn-danger">Eliminar</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
