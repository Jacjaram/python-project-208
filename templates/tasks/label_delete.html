{% extends "base.html" %}
{% load django_bootstrap5 %}

{% block content %}
<div class="container mt-4">
    <h1>Eliminar etiqueta</h1>
    <p>¿Estás seguro de eliminar la etiqueta "{{ object.name }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sí, eliminar</button>
        <a href="{% url 'label_list' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
